<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Matawan Hub Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1424;color:#fff;font-family:system-ui,sans-serif;min-height:100vh}
.card{background:#1a2035;border-radius:12px;padding:22px}
.toggle{display:flex;background:#0d1424;border-radius:20px;padding:3px}
.toggle button{background:transparent;border:none;color:#778ca3;border-radius:16px;padding:4px 12px;cursor:pointer;font-size:12px}
.toggle button.active{background:#2a3550;color:#E8C547}
.bar-wrap{background:#0d1424;border-radius:4px;height:6px;margin-top:3px}
.bar-fill{height:6px;border-radius:4px;transition:width .5s}
.kpi{border-radius:12px;padding:18px 22px;flex:1;min-width:160px;background:#1a2035}
.label{color:#778ca3;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.big-num{font-family:monospace;font-size:26px;font-weight:700;color:#fff}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:18px}
.sect-title{color:#fff;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.pill{background:#0d1424;border-radius:8px;padding:8px 14px}
.pill .pl{color:#778ca3;font-size:10px}
.pill .pv{font-family:monospace;font-weight:700;font-size:17px}
.review-item{background:#0d1424;border-radius:8px;padding:10px 12px;margin-bottom:8px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

const API_URL = 'https://qb-simple.onrender.com';

const COLORS={shipping:'#4F8EF7',uhaul:'#E8C547',mailbox:'#6BCB77',packing:'#FF6B6B',notary:'#C77DFF',printing:'#FF9F43',other:'#778CA3'};
const LABELS={shipping:'Shipping',uhaul:'U-Haul',mailbox:'Mailbox',packing:'Packing',notary:'Notary',printing:'Printing',other:'Other'};
const EXP_COLORS=['#FF6B6B','#FF9F43','#C77DFF','#4F8EF7','#6BCB77','#E8C547','#778CA3'];

const CUST={
  daily:[{l:'Mon',n:14,r:28},{l:'Tue',n:18,r:32},{l:'Wed',n:12,r:25},{l:'Thu',n:20,r:38},{l:'Fri',n:24,r:42},{l:'Sat',n:30,r:55},{l:'Sun',n:8,r:18}],
  weekly:[{l:'W1',n:62,r:148},{l:'W2',n:74,r:162},{l:'W3',n:58,r:155},{l:'W4',n:80,r:170},{l:'W5',n:70,r:160},{l:'W6',n:90,r:185},{l:'W7',n:66,r:172}],
  monthly:[{l:'Aug',n:240,r:580},{l:'Sep',n:265,r:610},{l:'Oct',n:280,r:640},{l:'Nov',n:310,r:670},{l:'Dec',n:350,r:720},{l:'Jan',n:290,r:660},{l:'Feb',n:275,r:635},{l:'Mar',n:320,r:690},{l:'Apr',n:295,r:650}]
};
const TRF={
  daily:[{l:'Mon',t:42,cps:114},{l:'Tue',t:50,cps:124},{l:'Wed',t:37,cps:110},{l:'Thu',t:58,cps:128},{l:'Fri',t:66,cps:130},{l:'Sat',t:85,cps:132},{l:'Sun',t:26,cps:112}],
  monthly:[{l:'Aug',t:820,cps:100},{l:'Sep',t:875,cps:101},{l:'Oct',t:910,cps:101},{l:'Nov',t:960,cps:102},{l:'Dec',t:1100,cps:105},{l:'Jan',t:850,cps:101},{l:'Feb',t:820,cps:101},{l:'Mar',t:960,cps:101},{l:'Apr',t:890,cps:101}]
};
const REVIEWS_G={avg:4.8,total:142,dist:[82,36,14,7,3],reviews:[
  {name:'Sarah M.',rating:5,date:'Apr 12',text:'Always fast and friendly. Best shipping store in town!'},
  {name:'James R.',rating:5,date:'Apr 8',text:'Used U-Haul and notary in one trip. Super convenient.'},
  {name:'Linda K.',rating:4,date:'Apr 5',text:'Good service, slight wait on Saturday.'},
  {name:'Tom B.',rating:3,date:'Mar 28',text:'Prices are fair. Could be more organized during busy hours.'}
]};
const REVIEWS_Y={avg:4.4,total:67,dist:[38,18,7,3,1],reviews:[
  {name:'Maria G.',rating:5,date:'Apr 10',text:'Super helpful staff, packed my fragile items perfectly.'},
  {name:'Derek F.',rating:4,date:'Apr 3',text:'Great location and prices on mailbox rental.'},
  {name:'Priya S.',rating:4,date:'Mar 30',text:'Notary was quick and professional.'},
  {name:'Nick W.',rating:3,date:'Mar 20',text:'Decent service but long lines on Fridays.'}
]};

const fmt=n=>'$'+Math.round(n).toLocaleString();
const fmtK=n=>n>=1000?'$'+(n/1000).toFixed(0)+'k':fmt(n);
const rc=r=>r>=5?'#6BCB77':r>=4?'#E8C547':'#FF6B6B';

function Toggle({options,value,onChange}){
  return <div className="toggle">{options.map(o=><button key={o.k} className={value===o.k?'active':''} onClick={()=>onChange(o.k)}>{o.l}</button>)}</div>;
}

function KpiCard({label,value,prefix='$',suffix='',color}){
  return <div className="kpi" style={{borderLeft:`4px solid ${color}`}}>
    <div className="label">{label}</div>
    <div className="big-num">{prefix}{typeof value==='number'?Math.round(value).toLocaleString():value}{suffix}</div>
  </div>;
}

function RevCard({data}){
  const [v,setV]=useState('bars');
  const total=data.reduce((s,d)=>s+(d.value||0),0);
  const getColor=(key,i)=>COLORS[key]||EXP_COLORS[i%7];
  return <div className="card">
    <div className="sect-title">Revenue by category <Toggle options={[{k:'donut',l:'◕ Chart'},{k:'bars',l:'▬ Bars'}]} value={v} onChange={setV}/></div>
    <div>{data.map((d,i)=><div key={i} style={{marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
        <span style={{color:'#a0aec0'}}>{LABELS[d.key]||d.key||d.name}</span>
        <span style={{fontFamily:'monospace',color:'#fff'}}>{fmt(d.value)} <span style={{color:'#778ca3',fontSize:11}}>({total>0?((d.value/total)*100).toFixed(0):0}%)</span></span>
      </div>
      <div className="bar-wrap"><div className="bar-fill" style={{width:`${total>0?(d.value/total)*100:0}%`,background:getColor(d.key,i)}}/></div>
    </div>)}</div>
    <div style={{borderTop:'1px solid #2a3550',marginTop:10,paddingTop:8,display:'flex',justifyContent:'space-between'}}>
      <span style={{color:'#778ca3',fontSize:12}}>Total Revenue</span>
      <span style={{color:'#E8C547',fontFamily:'monospace',fontWeight:700}}>{fmt(total)}</span>
    </div>
  </div>;
}

function ExpCard({data}){
  const total=data.reduce((s,d)=>s+(d.value||0),0);
  return <div className="card">
    <div className="sect-title">Expense breakdown</div>
    <div>{data.map((d,i)=><div key={i} style={{marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
        <span style={{color:'#a0aec0'}}>{d.name}</span>
        <span style={{fontFamily:'monospace',color:'#fff'}}>{fmt(d.value)} <span style={{color:'#778ca3',fontSize:11}}>({total>0?((d.value/total)*100).toFixed(0):0}%)</span></span>
      </div>
      <div className="bar-wrap"><div className="bar-fill" style={{width:`${total>0?(d.value/total)*100:0}%`,background:EXP_COLORS[i%7]}}/></div>
    </div>)}</div>
    <div style={{borderTop:'1px solid #2a3550',marginTop:10,paddingTop:8,display:'flex',justifyContent:'space-between'}}>
      <span style={{color:'#778ca3',fontSize:12}}>Total Expenses</span>
      <span style={{color:'#FF6B6B',fontFamily:'monospace',fontWeight:700}}>{fmt(total)}</span>
    </div>
  </div>;
}

function GrossMargin({revenue,expenses}){
  const profit=revenue-expenses;
  const pct=revenue>0?((profit/revenue)*100).toFixed(1):0;
  return <div className="card" style={{marginBottom:18}}>
    <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
      <span style={{color:'#fff',fontWeight:600}}>Gross Margin</span>
      <span style={{color:'#E8C547',fontFamily:'monospace',fontWeight:700}}>{pct}%</span>
    </div>
    <div style={{display:'flex',height:16,borderRadius:6,overflow:'hidden'}}>
      {revenue>0&&<div style={{flex:Math.max(profit,0),background:'#6BCB77'}}/>}
      <div style={{flex:expenses,background:'#FF6B6B'}}/>
    </div>
    <div style={{display:'flex',justifyContent:'space-between',marginTop:6}}>
      <span style={{color:profit>=0?'#6BCB77':'#FF6B6B',fontSize:12}}>Profit {fmt(profit)}</span>
      <span style={{color:'#FF6B6B',fontSize:12}}>Expenses {fmt(expenses)}</span>
    </div>
  </div>;
}

function Annualized({actual,goal}){
  const pct=Math.min((actual/goal)*100,100);
  const onTrack=actual/goal>=(new Date().getMonth()+1)/12;
  return <div className="card" style={{marginBottom:18}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <span style={{color:'#fff',fontWeight:600}}>Total Revenue Annualized</span>
      <span style={{background:onTrack?'#1a3a2a':'#3a1a1a',color:onTrack?'#6BCB77':'#FF6B6B',borderRadius:20,padding:'3px 12px',fontSize:12}}>{onTrack?'✓ On Track':'⚠ Behind Pace'}</span>
    </div>
    <div style={{background:'#0d1424',borderRadius:6,height:12,marginBottom:8}}>
      <div style={{width:`${pct}%`,height:'100%',borderRadius:6,background:onTrack?'#6BCB77':'#FF6B6B'}}/>
    </div>
    <div style={{display:'flex',justifyContent:'space-between',marginTop:10}}>
      <div><div style={{color:'#778ca3',fontSize:11}}>Actual</div><div style={{color:'#E8C547',fontFamily:'monospace',fontWeight:700,fontSize:20}}>{fmtK(actual)}</div></div>
      <div style={{textAlign:'right'}}><div style={{color:'#778ca3',fontSize:11}}>Goal</div><div style={{color:'#4F8EF7',fontFamily:'monospace',fontWeight:700,fontSize:20}}>{fmtK(goal)}</div></div>
    </div>
  </div>;
}

function CustomerChart(){
  const [p,setP]=useState('daily');
  const data=CUST[p];
  const totN=data.reduce((s,d)=>s+d.n,0),totR=data.reduce((s,d)=>s+d.r,0);
  const retPct=((totR/(totN+totR))*100).toFixed(0);
  const maxVal=Math.max(...data.map(d=>d.n+d.r));
  return <div className="card">
    <div className="sect-title">New vs. Returning <Toggle options={[{k:'daily',l:'Daily'},{k:'weekly',l:'Weekly'},{k:'monthly',l:'Monthly'}]} value={p} onChange={setP}/></div>
    <div style={{display:'flex',gap:8,marginBottom:12}}>
      <div className="pill" style={{flex:1}}><div className="pl">New</div><div className="pv" style={{color:'#6BCB77'}}>{totN.toLocaleString()}</div></div>
      <div className="pill" style={{flex:1}}><div className="pl">Returning</div><div className="pv" style={{color:'#C77DFF'}}>{totR.toLocaleString()}</div></div>
      <div className="pill" style={{flex:1}}><div className="pl">Retention</div><div className="pv" style={{color:'#E8C547'}}>{retPct}%</div></div>
    </div>
    <div style={{display:'flex',alignItems:'flex-end',gap:4,height:120}}>
      {data.map((d,i)=>{
        const pctN=(d.n/maxVal)*100, pctR=(d.r/maxVal)*100;
        return <div key={i} style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'flex-end',height:'100%'}}>
          <div style={{height:`${pctN}%`,background:'#6BCB77',borderRadius:'4px 4px 0 0'}}/>
          <div style={{height:`${pctR}%`,background:'#C77DFF'}}/>
        </div>;
      })}
    </div>
    <div style={{display:'flex',gap:4,marginTop:4}}>{data.map((d,i)=><span key={i} style={{flex:1,textAlign:'center',fontSize:10,color:'#778ca3'}}>{d.l}</span>)}</div>
  </div>;
}

function ReviewsCard(){
  const [p,setP]=useState('google');
  const d=p==='google'?REVIEWS_G:REVIEWS_Y;
  return <div className="card">
    <div className="sect-title">Customer Reviews <Toggle options={[{k:'google',l:'Google'},{k:'yelp',l:'Yelp'}]} value={p} onChange={setP}/></div>
    <div style={{display:'flex',gap:14,marginBottom:12,alignItems:'center'}}>
      <div style={{textAlign:'center'}}>
        <div style={{color:'#E8C547',fontSize:32,fontFamily:'monospace',fontWeight:700}}>{d.avg}</div>
        <div style={{color:'#E8C547',fontSize:16}}>★★★★★</div>
        <div style={{color:'#778ca3',fontSize:11}}>{d.total} reviews</div>
      </div>
      <div style={{flex:1}}>{d.dist.map((cnt,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:5,marginBottom:4}}>
        <span style={{color:'#778ca3',fontSize:11,width:10}}>{5-i}</span>
        <div style={{flex:1,background:'#0d1424',borderRadius:3,height:5}}>
          <div style={{width:`${(cnt/d.total)*100}%`,height:5,borderRadius:3,background:'#E8C547'}}/>
        </div>
      </div>)}</div>
    </div>
    <div style={{maxHeight:200,overflowY:'auto'}}>
      {d.reviews.map((r,i)=><div key={i} style={{background:'#0d1424',borderRadius:8,padding:'8px 10px',marginBottom:7,borderLeft:`3px solid ${rc(r.rating)}`}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
          <span style={{color:'#fff',fontSize:12,fontWeight:600}}>{r.name}</span>
          <span style={{color:'#778ca3',fontSize:11}}>{r.date}</span>
        </div>
        <div style={{color:'#a0aec0',fontSize:11,lineHeight:1.5}}>{r.text}</div>
      </div>)}
    </div>
  </div>;
}

function TrafficChart(){
  const [p,setP]=useState('daily');
  const data=TRF[p];
  const maxT=Math.max(...data.map(d=>d.t));
  const avgCPS=Math.round(data.reduce((s,d)=>s+d.cps,0)/data.length);
  const bestCPS=Math.min(...data.map(d=>d.cps));
  const worstCPS=Math.max(...data.map(d=>d.cps));
  return <div className="card">
    <div className="sect-title">Transactions & CPS <Toggle options={[{k:'daily',l:'Daily'},{k:'monthly',l:'Monthly'}]} value={p} onChange={setP}/></div>
    <div style={{display:'flex',gap:8,marginBottom:12}}>
      <div className="pill"><div className="pl">Avg CPS</div><div className="pv" style={{color:'#E8C547'}}>${avgCPS}</div></div>
      <div className="pill"><div className="pl">Best</div><div className="pv" style={{color:'#6BCB77'}}>${bestCPS}</div></div>
      <div className="pill"><div className="pl">Worst</div><div className="pv" style={{color:'#FF6B6B'}}>${worstCPS}</div></div>
    </div>
    <div style={{display:'flex',alignItems:'flex-end',gap:4,height:120}}>
      {data.map((d,i)=><div key={i} style={{flex:1,height:`${(d.t/maxT)*100}%`,background:'#4F8EF7',borderRadius:'4px 4px 0 0'}}/>)}
    </div>
    <div style={{display:'flex',gap:4,marginTop:4}}>{data.map((d,i)=><span key={i} style={{flex:1,textAlign:'center',fontSize:10,color:'#778ca3'}}>{d.l}</span>)}</div>
  </div>;
}

function App(){
  const [period,setPeriod]=useState('month');
  const [store,setStore]=useState('matawan');
  const [liveData,setLiveData]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const [lastSync,setLastSync]=useState(null);
  const [error,setError]=useState(null);

  useEffect(()=>{
    setSyncing(true);
    setError(null);
    fetch(`${API_URL}/data?period=${period}`)
      .then(r=>r.json())
      .then(d=>{
        if(d.connected){
          setLiveData(d);
          setLastSync(new Date());
        } else {
          setError(d.message||'Not connected');
        }
      })
      .catch(e=>setError(e.message))
      .finally(()=>setSyncing(false));
  },[period]);

  const kpi=liveData?.kpi||{revenue:0,expenses:0,netProfit:0,grossMargin:0};
  const rev=liveData?.revenue||[];
  const exp=liveData?.expenses||[];
  const annualizedActual=liveData?Math.round(kpi.revenue*(12/(new Date().getMonth()+1))):0;

  return <div style={{padding:20,maxWidth:1400,margin:'0 auto'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18,flexWrap:'wrap',gap:10}}>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        {['matawan','aberdeen'].map(s=><button key={s} onClick={()=>setStore(s)} style={{
          background:store===s?'#2a3550':'transparent',border:`1px solid ${store===s?'#E8C547':'#2a3550'}`,
          color:store===s?'#E8C547':'#778ca3',borderRadius:20,padding:'4px 14px',cursor:'pointer',fontSize:13
        }}>{s==='matawan'?'Matawan Hub':'Aberdeen'}</button>)}
        <button style={{background:'transparent',border:'1px dashed #2a3550',color:'#778ca3',borderRadius:20,padding:'4px 14px',cursor:'pointer',fontSize:13}}>+ Add Store</button>
      </div>
      <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
        {error&&<span style={{color:'#FF6B6B',fontSize:12}}>⚠ {error} — <a href={`${API_URL}/connect`} target="_blank" style={{color:'#E8C547'}}>Reconnect QB</a></span>}
        <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'#778ca3'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:syncing?'#E8C547':liveData?'#6BCB77':'#FF6B6B'}}/>
          {syncing?'Syncing…':lastSync?`Live QB data · ${lastSync.toLocaleTimeString()}`:'Not connected'}
        </div>
        <Toggle options={[{k:'day',l:'Today'},{k:'week',l:'Week'},{k:'month',l:'Month'},{k:'quarter',l:'Quarter'},{k:'year',l:'Year'}]} value={period} onChange={setPeriod}/>
      </div>
    </div>

    <div className="row">
      <KpiCard label="Total Revenue" value={kpi.revenue} color="#4F8EF7"/>
      <KpiCard label="Total Expenses" value={kpi.expenses} color="#FF6B6B"/>
      <KpiCard label="Net Profit" value={kpi.netProfit} color={kpi.netProfit>=0?'#6BCB77':'#FF6B6B'}/>
      <KpiCard label="Gross Margin" value={Math.abs(kpi.grossMargin)} prefix="" suffix="%" color="#E8C547"/>
    </div>

    <GrossMargin revenue={kpi.revenue} expenses={kpi.expenses}/>
    <Annualized actual={annualizedActual} goal={500000}/>

    <div className="row">
      {rev.length>0?<RevCard data={rev}/>:<div className="card" style={{flex:1}}><div style={{color:'#778ca3',textAlign:'center',padding:40}}>No revenue data for this period</div></div>}
      {exp.length>0?<ExpCard data={exp}/>:<div className="card" style={{flex:1}}><div style={{color:'#778ca3',textAlign:'center',padding:40}}>No expense data for this period</div></div>}
    </div>

    <div className="grid3">
      <CustomerChart/>
      <ReviewsCard/>
      <TrafficChart/>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
