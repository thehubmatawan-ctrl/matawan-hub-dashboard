<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Matawan Hub Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.10.0/umd/Recharts.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1424; color: #fff; font-family: system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0d1424; }
  ::-webkit-scrollbar-thumb { background: #2a3550; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } = Recharts;

const API_URL = 'https://matawan-hub-backend-production.up.railway.app';
const API_KEY = '4EaSsP5h9W1TddVi0LJmRtxm';

const COLORS = { shipping:'#4F8EF7', uhaul:'#E8C547', mailbox:'#6BCB77', packing:'#FF6B6B', notary:'#C77DFF', printing:'#FF9F43', other:'#778CA3' };
const LABELS = { shipping:'Shipping', uhaul:'U-Haul', mailbox:'Mailbox', packing:'Packing', notary:'Notary', printing:'Printing', other:'Other' };

const MOCK_KPI = { revenue:97800, expenses:54600, netProfit:43200, grossMargin:44.2 };
const MOCK_REV = [
  {key:'shipping',value:38400},{key:'uhaul',value:22100},{key:'mailbox',value:14800},
  {key:'packing',value:9200},{key:'notary',value:5600},{key:'printing',value:4900},{key:'other',value:2800}
];
const MOCK_EXP = [
  {name:'Payroll',value:28000},{name:'Rent',value:8500},{name:'UPS/FedEx',value:6200},
  {name:'U-Haul Fleet',value:4800},{name:'Supplies',value:2100},{name:'Utilities',value:1800},{name:'Other',value:3200}
];
const EXP_COLORS = ['#FF6B6B','#FF9F43','#C77DFF','#4F8EF7','#6BCB77','#E8C547','#778CA3'];

const CUST_DAILY = [{l:'Mon',n:14,r:28},{l:'Tue',n:18,r:32},{l:'Wed',n:12,r:25},{l:'Thu',n:20,r:38},{l:'Fri',n:24,r:42},{l:'Sat',n:30,r:55},{l:'Sun',n:8,r:18}];
const CUST_WEEKLY = [{l:'W1',n:62,r:148},{l:'W2',n:74,r:162},{l:'W3',n:58,r:155},{l:'W4',n:80,r:170},{l:'W5',n:70,r:160},{l:'W6',n:90,r:185},{l:'W7',n:66,r:172},{l:'W8',n:78,r:168},{l:'W9',n:82,r:175}];
const CUST_MONTHLY = [{l:'Aug',n:240,r:580},{l:'Sep',n:265,r:610},{l:'Oct',n:280,r:640},{l:'Nov',n:310,r:670},{l:'Dec',n:350,r:720},{l:'Jan',n:290,r:660},{l:'Feb',n:275,r:635},{l:'Mar',n:320,r:690},{l:'Apr',n:295,r:650}];

const TRF_DAILY = [{l:'Mon',t:42,rev:4800,cps:114},{l:'Tue',t:50,rev:6200,cps:124},{l:'Wed',t:37,rev:4100,cps:110},{l:'Thu',t:58,rev:7400,cps:128},{l:'Fri',t:66,rev:8600,cps:130},{l:'Sat',t:85,rev:11200,cps:132},{l:'Sun',t:26,rev:2900,cps:112}];
const TRF_MONTHLY = [{l:'Aug',t:820,rev:82000,cps:100},{l:'Sep',t:875,rev:88000,cps:101},{l:'Oct',t:910,rev:92000,cps:101},{l:'Nov',t:960,rev:98000,cps:102},{l:'Dec',t:1100,rev:115000,cps:105},{l:'Jan',t:850,rev:86000,cps:101},{l:'Feb',t:820,rev:83000,cps:101},{l:'Mar',t:960,rev:97000,cps:101},{l:'Apr',t:890,rev:90000,cps:101}];

const REVIEWS_G = { avg:4.8, total:142, dist:[82,36,14,7,3], reviews:[
  {name:'Sarah M.',rating:5,date:'Apr 12',text:'Always fast and friendly. Best shipping store in town!'},
  {name:'James R.',rating:5,date:'Apr 8',text:'Used U-Haul and notary in one trip. Super convenient.'},
  {name:'Linda K.',rating:4,date:'Apr 5',text:'Good service, slight wait on Saturday but worth it.'},
  {name:'Tom B.',rating:3,date:'Mar 28',text:'Prices are fair. Staff could be more organized during busy hours.'}
]};
const REVIEWS_Y = { avg:4.4, total:67, dist:[38,18,7,3,1], reviews:[
  {name:'Maria G.',rating:5,date:'Apr 10',text:'Super helpful staff, they packed my fragile items perfectly.'},
  {name:'Derek F.',rating:4,date:'Apr 3',text:'Great location and good prices on mailbox rental.'},
  {name:'Priya S.',rating:4,date:'Mar 30',text:'Notary was quick and professional. Will return.'},
  {name:'Nick W.',rating:3,date:'Mar 20',text:'Decent service but long lines on Fridays.'}
]};

const fmt = n => '$' + Math.round(n).toLocaleString();
const fmtK = n => n >= 1000 ? '$' + (n/1000).toFixed(0) + 'k' : fmt(n);
const ratingColor = r => r >= 5 ? '#6BCB77' : r >= 4 ? '#E8C547' : '#FF6B6B';

function Toggle({options, value, onChange}) {
  return <div style={{display:'flex',background:'#0d1424',borderRadius:20,padding:3}}>
    {options.map(o => <button key={o.k} onClick={()=>onChange(o.k)} style={{
      background:value===o.k?'#2a3550':'transparent', border:'none',
      color:value===o.k?'#E8C547':'#778ca3', borderRadius:16, padding:'4px 12px',
      cursor:'pointer', fontSize:12
    }}>{o.l}</button>)}
  </div>;
}

function KpiCard({label, value, prefix='$', suffix='', color}) {
  return <div style={{background:'#1a2035',borderRadius:12,padding:'18px 22px',flex:1,minWidth:170,borderLeft:`4px solid ${color}`}}>
    <div style={{color:'#778ca3',fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>{label}</div>
    <div style={{color:'#fff',fontSize:26,fontFamily:'monospace',fontWeight:700}}>{prefix}{Math.round(value).toLocaleString()}{suffix}</div>
  </div>;
}

function RevCard({data}) {
  const [v,setV] = useState('donut');
  const total = data.reduce((s,d)=>s+d.value,0);
  return <div style={{background:'#1a2035',borderRadius:12,padding:22,flex:1}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
      <span style={{color:'#fff',fontWeight:600}}>Revenue by category</span>
      <Toggle options={[{k:'donut',l:'◕ Chart'},{k:'bars',l:'▬ Bars'}]} value={v} onChange={setV}/>
    </div>
    {v==='donut' ? <>
      <ResponsiveContainer width="100%" height={180}>
        <PieChart><Pie data={data.map(d=>({name:LABELS[d.key]||d.key,value:d.value}))} cx="50%" cy="50%" innerRadius={50} outerRadius={80} dataKey="value">
          {data.map((d,i)=><Cell key={i} fill={COLORS[d.key]||'#778ca3'}/>)}
        </Pie><Tooltip formatter={v=>fmt(v)}/></PieChart>
      </ResponsiveContainer>
      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:6}}>
        {data.map(d=><div key={d.key} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'#a0aec0'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:COLORS[d.key]||'#778ca3'}}/>{LABELS[d.key]||d.key}
        </div>)}
      </div>
    </> : <div>{data.map(d=><div key={d.key} style={{marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
        <span style={{color:'#a0aec0',fontSize:12}}>{LABELS[d.key]||d.key}</span>
        <span style={{color:'#fff',fontSize:12,fontFamily:'monospace'}}>{fmt(d.value)} <span style={{color:'#778ca3',fontSize:10}}>({((d.value/total)*100).toFixed(0)}%)</span></span>
      </div>
      <div style={{background:'#0d1424',borderRadius:3,height:5}}>
        <div style={{width:`${(d.value/total)*100}%`,height:5,borderRadius:3,background:COLORS[d.key]||'#778ca3'}}/>
      </div>
    </div>)}</div>}
    <div style={{borderTop:'1px solid #2a3550',marginTop:10,paddingTop:8,display:'flex',justifyContent:'space-between'}}>
      <span style={{color:'#778ca3',fontSize:12}}>Total Revenue</span>
      <span style={{color:'#E8C547',fontFamily:'monospace',fontWeight:700}}>{fmt(total)}</span>
    </div>
  </div>;
}

function ExpCard({data}) {
  const [v,setV] = useState('bars');
  const total = data.reduce((s,d)=>s+d.value,0);
  return <div style={{background:'#1a2035',borderRadius:12,padding:22,flex:1}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
      <span style={{color:'#fff',fontWeight:600}}>Expense breakdown</span>
      <Toggle options={[{k:'donut',l:'◕ Chart'},{k:'bars',l:'▬ Bars'}]} value={v} onChange={setV}/>
    </div>
    {v==='donut' ? <>
      <ResponsiveContainer width="100%" height={180}>
        <PieChart><Pie data={data} cx="50%" cy="50%" innerRadius={50} outerRadius={80} dataKey="value">
          {data.map((_,i)=><Cell key={i} fill={EXP_COLORS[i%7]}/>)}
        </Pie><Tooltip formatter={v=>fmt(v)}/></PieChart>
      </ResponsiveContainer>
      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:6}}>
        {data.map((d,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'#a0aec0'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:EXP_COLORS[i%7]}}/>{d.name}
        </div>)}
      </div>
    </> : <div>{data.map((d,i)=><div key={i} style={{marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
        <span style={{color:'#a0aec0',fontSize:12}}>{d.name}</span>
        <span style={{color:'#fff',fontSize:12,fontFamily:'monospace'}}>{fmt(d.value)} <span style={{color:'#778ca3',fontSize:10}}>({((d.value/total)*100).toFixed(0)}%)</span></span>
      </div>
      <div style={{background:'#0d1424',borderRadius:3,height:5}}>
        <div style={{width:`${(d.value/total)*100}%`,height:5,borderRadius:3,background:EXP_COLORS[i%7]}}/>
      </div>
    </div>)}</div>}
    <div style={{borderTop:'1px solid #2a3550',marginTop:10,paddingTop:8,display:'flex',justifyContent:'space-between'}}>
      <span style={{color:'#778ca3',fontSize:12}}>Total Expenses</span>
      <span style={{color:'#FF6B6B',fontFamily:'monospace',fontWeight:700}}>{fmt(total)}</span>
    </div>
  </div>;
}

function Annualized({actual,goal}) {
  const pct = Math.min((actual/goal)*100,100);
  const onTrack = actual/goal >= (new Date().getMonth()+1)/12;
  return <div style={{background:'#1a2035',borderRadius:12,padding:'18px 24px',marginBottom:18}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <span style={{color:'#fff',fontWeight:600}}>Total Revenue Annualized</span>
      <span style={{background:onTrack?'#1a3a2a':'#3a1a1a',color:onTrack?'#6BCB77':'#FF6B6B',borderRadius:20,padding:'3px 12px',fontSize:12}}>
        {onTrack?'✓ On Track':'⚠ Behind Pace'}
      </span>
    </div>
    <div style={{background:'#0d1424',borderRadius:6,height:12,marginBottom:8}}>
      <div style={{width:`${pct}%`,height:'100%',borderRadius:6,background:onTrack?'#6BCB77':'#FF6B6B'}}/>
    </div>
    <div style={{display:'flex',justifyContent:'space-between',marginTop:10}}>
      <div><div style={{color:'#778ca3',fontSize:11}}>Actual</div><div style={{color:'#E8C547',fontFamily:'monospace',fontWeight:700,fontSize:20}}>{fmtK(actual)}</div></div>
      <div style={{textAlign:'right'}}><div style={{color:'#778ca3',fontSize:11}}>Goal</div><div style={{color:'#4F8EF7',fontFamily:'monospace',fontWeight:700,fontSize:20}}>{fmtK(goal)}</div></div>
    </div>
  </div>;
}

function GrossMargin({revenue,expenses}) {
  const profit = revenue-expenses;
  const pct = ((profit/revenue)*100).toFixed(1);
  return <div style={{background:'#1a2035',borderRadius:12,padding:22,marginBottom:18}}>
    <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
      <span style={{color:'#fff',fontWeight:600}}>Gross Margin</span>
      <span style={{color:'#E8C547',fontFamily:'monospace',fontWeight:700}}>{pct}%</span>
    </div>
    <div style={{display:'flex',height:16,borderRadius:6,overflow:'hidden'}}>
      <div style={{flex:profit,background:'#6BCB77'}}/><div style={{flex:expenses,background:'#FF6B6B'}}/>
    </div>
    <div style={{display:'flex',justifyContent:'space-between',marginTop:6}}>
      <span style={{color:'#6BCB77',fontSize:12}}>Profit {fmt(profit)}</span>
      <span style={{color:'#FF6B6B',fontSize:12}}>Expenses {fmt(expenses)}</span>
    </div>
  </div>;
}

function CustomerChart() {
  const [p,setP] = useState('daily');
  const data = p==='daily'?CUST_DAILY:p==='weekly'?CUST_WEEKLY:CUST_MONTHLY;
  const totN = data.reduce((s,d)=>s+d.n,0), totR = data.reduce((s,d)=>s+d.r,0);
  const retPct = ((totR/(totN+totR))*100).toFixed(0);
  return <div style={{background:'#1a2035',borderRadius:12,padding:22}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <span style={{color:'#fff',fontWeight:600}}>New vs. Returning</span>
      <Toggle options={[{k:'daily',l:'Daily'},{k:'weekly',l:'Weekly'},{k:'monthly',l:'Monthly'}]} value={p} onChange={setP}/>
    </div>
    <div style={{display:'flex',gap:10,marginBottom:12}}>
      <div style={{background:'#0d1424',borderRadius:8,padding:'8px 14px',flex:1}}><div style={{color:'#778ca3',fontSize:10}}>New</div><div style={{color:'#6BCB77',fontFamily:'monospace',fontWeight:700,fontSize:18}}>{totN.toLocaleString()}</div></div>
      <div style={{background:'#0d1424',borderRadius:8,padding:'8px 14px',flex:1}}><div style={{color:'#778ca3',fontSize:10}}>Returning</div><div style={{color:'#C77DFF',fontFamily:'monospace',fontWeight:700,fontSize:18}}>{totR.toLocaleString()}</div></div>
      <div style={{background:'#0d1424',borderRadius:8,padding:'8px 14px',flex:1}}><div style={{color:'#778ca3',fontSize:10}}>Retention</div><div style={{color:'#E8C547',fontFamily:'monospace',fontWeight:700,fontSize:18}}>{retPct}%</div></div>
    </div>
    <ResponsiveContainer width="100%" height={160}>
      <BarChart data={data} margin={{top:0,right:0,left:-20,bottom:0}}>
        <XAxis dataKey="l" tick={{fill:'#778ca3',fontSize:11}} axisLine={false} tickLine={false}/>
        <YAxis tick={{fill:'#778ca3',fontSize:11}} axisLine={false} tickLine={false}/>
        <Tooltip contentStyle={{background:'#1a2035',border:'none',borderRadius:8,color:'#fff'}}/>
        <Bar dataKey="r" stackId="a" fill="#C77DFF" name="Returning"/>
        <Bar dataKey="n" stackId="a" fill="#6BCB77" radius={[4,4,0,0]} name="New"/>
      </BarChart>
    </ResponsiveContainer>
  </div>;
}

function ReviewsCard() {
  const [p,setP] = useState('google');
  const d = p==='google'?REVIEWS_G:REVIEWS_Y;
  return <div style={{background:'#1a2035',borderRadius:12,padding:22}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <span style={{color:'#fff',fontWeight:600}}>Customer Reviews</span>
      <Toggle options={[{k:'google',l:'Google'},{k:'yelp',l:'Yelp'}]} value={p} onChange={setP}/>
    </div>
    <div style={{display:'flex',gap:14,marginBottom:12,alignItems:'center'}}>
      <div style={{textAlign:'center'}}>
        <div style={{color:'#E8C547',fontSize:32,fontFamily:'monospace',fontWeight:700}}>{d.avg}</div>
        <div style={{color:'#E8C547',fontSize:16}}>★★★★★</div>
        <div style={{color:'#778ca3',fontSize:11}}>{d.total} reviews</div>
      </div>
      <div style={{flex:1}}>{d.dist.map((cnt,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:5,marginBottom:3}}>
        <span style={{color:'#778ca3',fontSize:11,width:10}}>{5-i}</span>
        <div style={{flex:1,background:'#0d1424',borderRadius:3,height:5}}>
          <div style={{width:`${(cnt/d.total)*100}%`,height:5,borderRadius:3,background:'#E8C547'}}/>
        </div>
      </div>)}</div>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:7,maxHeight:200,overflowY:'auto'}}>
      {d.reviews.map((r,i)=><div key={i} style={{background:'#0d1424',borderRadius:8,padding:'8px 10px',borderLeft:`3px solid ${ratingColor(r.rating)}`}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
          <span style={{color:'#fff',fontSize:12,fontWeight:600}}>{r.name}</span>
          <span style={{color:'#778ca3',fontSize:11}}>{r.date}</span>
        </div>
        <div style={{color:'#a0aec0',fontSize:11,lineHeight:1.5}}>{r.text}</div>
      </div>)}
    </div>
  </div>;
}

function TrafficChart() {
  const [p,setP] = useState('daily');
  const data = p==='daily'?TRF_DAILY:TRF_MONTHLY;
  const avgCPS = Math.round(data.reduce((s,d)=>s+d.cps,0)/data.length);
  const bestCPS = Math.min(...data.map(d=>d.cps));
  const worstCPS = Math.max(...data.map(d=>d.cps));
  return <div style={{background:'#1a2035',borderRadius:12,padding:22}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <span style={{color:'#fff',fontWeight:600}}>Transactions & Cost Per Sale</span>
      <Toggle options={[{k:'daily',l:'Daily'},{k:'monthly',l:'Monthly'}]} value={p} onChange={setP}/>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:12}}>
      <div style={{background:'#0d1424',borderRadius:8,padding:'7px 12px'}}><div style={{color:'#778ca3',fontSize:10}}>Avg CPS</div><div style={{color:'#E8C547',fontFamily:'monospace',fontWeight:700}}>${avgCPS}</div></div>
      <div style={{background:'#0d1424',borderRadius:8,padding:'7px 12px'}}><div style={{color:'#778ca3',fontSize:10}}>Best</div><div style={{color:'#6BCB77',fontFamily:'monospace',fontWeight:700}}>${bestCPS}</div></div>
      <div style={{background:'#0d1424',borderRadius:8,padding:'7px 12px'}}><div style={{color:'#778ca3',fontSize:10}}>Worst</div><div style={{color:'#FF6B6B',fontFamily:'monospace',fontWeight:700}}>${worstCPS}</div></div>
    </div>
    <ResponsiveContainer width="100%" height={160}>
      <BarChart data={data} margin={{top:0,right:0,left:-20,bottom:0}}>
        <XAxis dataKey="l" tick={{fill:'#778ca3',fontSize:11}} axisLine={false} tickLine={false}/>
        <YAxis tick={{fill:'#778ca3',fontSize:11}} axisLine={false} tickLine={false}/>
        <Tooltip contentStyle={{background:'#1a2035',border:'none',borderRadius:8,color:'#fff'}}/>
        <Bar dataKey="t" fill="#4F8EF7" radius={[4,4,0,0]} name="Transactions"/>
      </BarChart>
    </ResponsiveContainer>
  </div>;
}

function App() {
  const [period,setPeriod] = useState('month');
  const [store,setStore] = useState('matawan');
  const [liveData,setLiveData] = useState(null);
  const [syncing,setSyncing] = useState(false);
  const [lastSync,setLastSync] = useState(null);

  useEffect(()=>{
    setSyncing(true);
    const h = {'x-api-key':API_KEY};
    Promise.all([
      fetch(`${API_URL}/api/dashboard/summary?period=${period}`,{headers:h}).then(r=>r.json()).catch(()=>null),
      fetch(`${API_URL}/api/dashboard/revenue/1?period=${period}`,{headers:h}).then(r=>r.json()).catch(()=>null),
      fetch(`${API_URL}/api/dashboard/expenses/1?period=${period}`,{headers:h}).then(r=>r.json()).catch(()=>null),
    ]).then(([summary,revenue,expenses])=>{
      if(summary&&revenue&&expenses){ setLiveData({summary,revenue,expenses}); setLastSync(new Date()); }
    }).finally(()=>setSyncing(false));
  },[period]);

  const kpi = liveData?.summary || MOCK_KPI;
  const rev = liveData?.revenue || MOCK_REV;
  const exp = liveData?.expenses || MOCK_EXP;

  return <div style={{padding:22,maxWidth:1400,margin:'0 auto'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18,flexWrap:'wrap',gap:10}}>
      <div style={{display:'flex',gap:8}}>
        {['matawan','aberdeen'].map(s=><button key={s} onClick={()=>setStore(s)} style={{
          background:store===s?'#2a3550':'transparent', border:`1px solid ${store===s?'#E8C547':'#2a3550'}`,
          color:store===s?'#E8C547':'#778ca3', borderRadius:20, padding:'4px 14px', cursor:'pointer', fontSize:13
        }}>{s==='matawan'?'Matawan Hub':'Aberdeen'}</button>)}
        <button style={{background:'transparent',border:'1px dashed #2a3550',color:'#778ca3',borderRadius:20,padding:'4px 14px',cursor:'pointer',fontSize:13}}>+ Add Store</button>
      </div>
      <div style={{display:'flex',gap:12,alignItems:'center'}}>
        <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'#778ca3'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:syncing?'#E8C547':'#6BCB77',boxShadow:`0 0 6px ${syncing?'#E8C547':'#6BCB77'}`}}/>
          {lastSync?`Synced ${lastSync.toLocaleTimeString()}`:syncing?'Syncing…':'Mock data'}
        </div>
        <Toggle options={[{k:'day',l:'Today'},{k:'week',l:'Week'},{k:'month',l:'Month'},{k:'quarter',l:'Quarter'},{k:'year',l:'Year'}]} value={period} onChange={setPeriod}/>
      </div>
    </div>

    <div style={{display:'flex',gap:14,marginBottom:18,flexWrap:'wrap'}}>
      <KpiCard label="Total Revenue" value={kpi.revenue||kpi.total_revenue||0} color="#4F8EF7"/>
      <KpiCard label="Total Expenses" value={kpi.expenses||kpi.total_expenses||0} color="#FF6B6B"/>
      <KpiCard label="Net Profit" value={kpi.netProfit||kpi.net_profit||0} color="#6BCB77"/>
      <KpiCard label="Gross Margin" value={kpi.grossMargin||kpi.gross_margin||0} prefix="" suffix="%" color="#E8C547"/>
    </div>

    <GrossMargin revenue={kpi.revenue||kpi.total_revenue||MOCK_KPI.revenue} expenses={kpi.expenses||kpi.total_expenses||MOCK_KPI.expenses}/>
    <Annualized actual={125000} goal={500000}/>

    <div style={{display:'flex',gap:18,marginBottom:18,flexWrap:'wrap'}}>
      <RevCard data={rev}/>
      <ExpCard data={exp}/>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))',gap:18}}>
      <CustomerChart/>
      <ReviewsCard/>
      <TrafficChart/>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
